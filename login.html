<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تسجيل الدخول | نظام إدارة بيانات الدفعات</title><link rel="stylesheet" href="auth.css"></head><body><header><img src="https://a.top4top.io/p_3942jt4h81.png" referrerpolicy="no-referrer" alt="شعار المنصة"><h1>نظام إدارة بيانات الدفعات</h1></header><main><h2>🔐 تسجيل الدخول</h2><p>للمستخدمين المصرح لهم فقط</p><form id="form"><label for="email">البريد الإلكتروني</label><input id="email" type="email" autocomplete="username" required><label for="password">كلمة المرور</label><input id="password" type="password" autocomplete="current-password" required><button type="submit">دخول آمن</button></form><p id="status" role="alert"></p><p class="notice">يلزم تشغيل الخادم وضبط اتصال Supabase قبل استخدام الحسابات.</p></main><footer>حماية البيانات تبدأ من صلاحيات الوصول</footer><script type="module">import {createClient} from 'https://esm.sh/@supabase/supabase-js@2';import {SUPABASE_URL,SUPABASE_ANON_KEY} from './config.js';const out=document.querySelector('#status');document.querySelector('#form').onsubmit=async e=>{e.preventDefault();if(SUPABASE_ANON_KEY==='PASTE_PUBLIC_SUPABASE_KEY_HERE'){out.textContent='لم تُضبط إعدادات الاتصال. افتحي config.js وأدخلي عنوان Supabase ومفتاحه العام.';return;}try{const client=createClient(SUPABASE_URL,SUPABASE_ANON_KEY);const {error}=await client.auth.signInWithPassword({email:document.querySelector('#email').value,password:document.querySelector('#password').value});if(error)throw error;location.replace('index.html')}catch(err){out.textContent='تعذر تسجيل الدخول: '+err.message}};</script><script>
/* Cosmetic deterrent only. HTML/JS remain accessible to browser users. */
document.addEventListener('contextmenu',function(event){
  if(!event.target.closest('input,textarea,[contenteditable="true"]')) event.preventDefault();
});
document.addEventListener('keydown',function(event){
  if((event.ctrlKey||event.metaKey)&&!event.shiftKey&&event.key.toLowerCase()==='u'){
    event.preventDefault();
  }
});
</script></body></html>
