<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إدارة الدفعات التدريبية</title><style>:root{font-family:Tahoma,Arial,sans-serif;color:#1c3934;background:#f5f7f4}*{box-sizing:border-box}body{margin:0}header{background:linear-gradient(115deg,#163e36,#285c50);color:white;padding:24px 5%}h1{margin:0;font-size:26px}main{max-width:1250px;margin:30px auto;padding:0 20px}.panel{background:white;border-radius:18px;padding:24px;box-shadow:0 6px 30px #20394b14;margin-bottom:20px}input,select,button{font:inherit;padding:12px;border-radius:10px;border:1px solid #cbd5e1}input{max-width:100%}button{cursor:pointer;background:#236254;color:white;border:0}button:disabled{opacity:.4;cursor:not-allowed}.toolbar{display:flex;gap:12px;flex-wrap:wrap;align-items:center}.toolbar input{flex:1;min-width:220px}.table-wrap{overflow:auto}table{border-collapse:collapse;width:100%;white-space:nowrap;font-size:13px}th,td{padding:12px;border-bottom:1px solid #e5e9ef;text-align:right}th{background:#eaf2ed;position:sticky;top:0}tr:hover{background:#f6fafb}.muted{color:#64748b}.hidden{display:none!important}.login{max-width:440px;margin:8vh auto}.login input{display:block;width:100%;margin:12px 0}.stat{font-weight:bold;color:#236254}#message{min-height:26px;color:#ad3e34}#pager{display:flex;align-items:center;gap:10px;justify-content:center;padding:18px}@media print{header,.toolbar,#pager,#login,#message{display:none!important}main{margin:0;padding:0}.panel{box-shadow:none;padding:0}table{font-size:10px;white-space:normal}tr:not(.chosen){display:none}th{position:static}}@media(max-width:600px){h1{font-size:20px}.panel{padding:14px}} .brand{display:flex;gap:20px;align-items:center;flex-wrap:wrap;margin-bottom:12px}.brand img{max-width:min(440px,100%);max-height:110px;object-fit:contain;background:white;border-radius:12px;padding:8px}button:focus-visible,input:focus-visible{outline:3px solid #d9b857;outline-offset:2px}</style></head><body><header><div class="brand"><img src="https://h.top4top.io/p_3939pgxsd1.png" alt="برنامج المحاسبين المميزين" onerror="this.style.display='none'"><img src="https://i.top4top.io/p_39392knk42.png" alt="الشعار الثاني" onerror="this.style.display='none'"></div><h1>📚 نظام إدارة بيانات الدفعات التدريبية</h1><p>بحث دقيق • صلاحيات وصول • تصدير وطباعة السجلات المصرح بها</p></header><main><section id="login" class="panel login"><h2>🔐 تسجيل الدخول</h2><p class="muted">الدخول للمستخدمين المعتمدين فقط</p><input id="email" type="email" placeholder="البريد الإلكتروني" autocomplete="username"><input id="password" type="password" placeholder="كلمة المرور" autocomplete="current-password"><button id="signIn">دخول</button><p id="loginError" role="alert"></p><button id="showSetup" type="button" style="background:#e8f1f2;color:#14515b;margin-top:12px">إعداد حساب المدير لأول مرة</button><div id="setupBox" class="hidden"><p class="muted">تُستخدم هذه الصفحة مرة واحدة فقط. احصلي على مفتاح الإعداد السري من إعدادات الخادم.</p><input id="setupKey" type="password" placeholder="مفتاح الإعداد السري"><input id="setupEmail" type="email" placeholder="بريد المدير الإلكتروني"><input id="setupPassword" type="password" minlength="12" placeholder="كلمة مرور قوية (12 حرفًا على الأقل)"><button id="createAdmin" type="button">إنشاء حساب المدير</button><p id="setupMessage" role="status"></p></div></section><section id="app" class="hidden"><div class="panel"><div class="toolbar"><select id="sheet"><option value="">كل الأوراق</option></select><input id="search" type="search" placeholder="ابحث بأي اسم أو عنوان أو قيمة من الأعمدة..."><button id="find">🔎 بحث</button><button id="logout">خروج</button></div><p class="stat" id="summary"></p></div><div class="panel"><div class="toolbar"><button id="selectPage">تحديد الصفحة</button><button id="clear">إلغاء التحديد</button><button id="print">🖨️ طباعة المحدد</button><button id="export">📥 تصدير المحدد Excel</button><span id="selectedCount" class="muted"></span></div><p id="message" role="status"></p><div class="table-wrap"><table id="records"><thead></thead><tbody></tbody></table></div><div id="pager"><button id="prev">السابق</button><span id="pageText"></span><button id="next">التالي</button></div></div></section></main><script type="module">
import {createClient} from 'https://esm.sh/@supabase/supabase-js@2';
// اضبط هذه القيم قبل النشر. المفتاح هنا هو المفتاح العام فقط، وليس service_role.
import {SUPABASE_URL,SUPABASE_ANON_KEY,API_BASE} from './config.js';
if(SUPABASE_ANON_KEY==='PASTE_PUBLIC_SUPABASE_KEY_HERE') { document.body.insertAdjacentHTML('afterbegin','<p role="alert" style="background:#fff0cd;padding:15px;text-align:center">يجب إدخال مفتاح Supabase العام في config.js قبل تسجيل الدخول.</p>'); }
const supabase=createClient(SUPABASE_URL,SUPABASE_ANON_KEY);const $=id=>document.getElementById(id);let page=1,total=0,rows=[],selected=new Set();const size=50;
function msg(s){$('message').textContent=s}function td(text){const x=document.createElement('td');x.textContent=text??'';return x}
async function request(path,opts={}){const {data:{session}}=await supabase.auth.getSession();if(!session)throw Error('انتهت الجلسة، يرجى تسجيل الدخول');const r=await fetch(API_BASE+'/api'+path,{...opts,headers:{Authorization:'Bearer '+session.access_token,...(opts.headers||{})}});if(!r.ok)throw Error(r.status===401?'انتهت صلاحية الدخول؛ أعيدي تسجيل الدخول':r.status===403?'الحساب غير مخوّل بالوصول إلى البيانات':r.status===500?'خطأ في قاعدة البيانات أو إعداد الخادم (500)':'تعذر تنفيذ الطلب ('+r.status+')');return r}
async function init(){const {data:{session}}=await supabase.auth.getSession();$('login').classList.toggle('hidden',!!session);$('app').classList.toggle('hidden',!session);if(!session){return;}try{const sheets=await (await request('/sheets')).json();$('sheet').replaceChildren(new Option('كل الأوراق',''),...sheets.map(x=>new Option(x.sheet_name+' ('+x.count+')',x.sheet_name)));await load()}catch(e){msg(e.message)}}
async function load(){try{msg('');const q=new URLSearchParams({page,sheet:$('sheet').value,search:$('search').value.trim()});const data=await (await request('/records?'+q)).json();rows=data.records;total=data.total;$('summary').textContent='عدد النتائج: '+total.toLocaleString('ar-SA');const keys=[...new Set(rows.flatMap(r=>Object.keys(r.payload)))];const head=$('records').querySelector('thead'),body=$('records').querySelector('tbody');head.replaceChildren();body.replaceChildren();const hr=document.createElement('tr');hr.appendChild(td('تحديد'));for(const key of keys){const h=document.createElement('th');h.textContent=key;hr.appendChild(h)}head.appendChild(hr);for(const r of rows){const tr=document.createElement('tr');if(selected.has(r.id))tr.classList.add('chosen');const c=document.createElement('input');c.type='checkbox';c.checked=selected.has(r.id);c.onchange=()=>{c.checked?selected.add(r.id):selected.delete(r.id);tr.classList.toggle('chosen',c.checked);updateCount()};const cell=document.createElement('td');cell.appendChild(c);tr.appendChild(cell);for(const key of keys)tr.appendChild(td(r.payload[key]));body.appendChild(tr)}$('pageText').textContent=`صفحة ${page} من ${Math.max(1,Math.ceil(total/size))}`;$('prev').disabled=page===1;$('next').disabled=page*size>=total;updateCount()}catch(e){msg(e.message)}}
function updateCount(){$('selectedCount').textContent='المحدد: '+selected.size+' سجل'}
// لا حاجة لإنشاء المدير من الواجهة بعد إنشاء الحساب.
$('showSetup')?.remove(); $('setupBox')?.remove();
$('signIn').onclick=async()=>{const btn=$('signIn');btn.disabled=true;try{$('loginError').textContent=''; if(SUPABASE_ANON_KEY==='PASTE_PUBLIC_SUPABASE_KEY_HERE')throw Error('أضيفي مفتاح Supabase العام في config.js أولًا');const {error}=await supabase.auth.signInWithPassword({email:$('email').value,password:$('password').value});if(error)throw error;await init()}catch(e){$('loginError').textContent='فشل تسجيل الدخول: '+e.message}finally{btn.disabled=false}};
$('password').addEventListener('keydown',e=>{if(e.key==='Enter')$('signIn').click()});
$('email').addEventListener('keydown',e=>{if(e.key==='Enter')$('signIn').click()});
$('logout').onclick=async()=>{await supabase.auth.signOut();selected.clear();location.replace('login.html')};$('find').onclick=()=>{page=1;selected.clear();load()};$('search').onkeydown=e=>{if(e.key==='Enter')$('find').click()};$('sheet').onchange=()=>{$('find').click()};$('prev').onclick=()=>{page--;load()};$('next').onclick=()=>{page++;load()};$('selectPage').onclick=()=>{rows.forEach(r=>selected.add(r.id));load()};$('clear').onclick=()=>{selected.clear();load()};$('print').onclick=()=>{if(!selected.size)return msg('حدد سجلات أولًا');const visible=rows.some(r=>selected.has(r.id));if(!visible)return msg('للطباعة، انتقل إلى صفحة تحتوي على سجلات محددة');window.print()};$('export').onclick=async()=>{if(!selected.size)return msg('حدد سجلات أولًا');try{const r=await request('/export',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({ids:[...selected].slice(0,1000)})});const blob=await r.blob(),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='البيانات_المحددة.xlsx';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}catch(e){msg(e.message)}};init();
</script></body></html>
