<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>نظام إدارة الدفعات التدريبية</title><style>
:root{font-family:Tahoma,Arial,sans-serif;color:#193d34;background:#f4f7f5}*{box-sizing:border-box}body{margin:0}header{background:linear-gradient(115deg,#173f36,#286255);color:#fff;padding:22px max(4%,20px)}header h1{margin:0 0 8px}main{max-width:1380px;margin:24px auto;padding:0 16px}.panel{background:#fff;border-radius:17px;padding:22px;margin-bottom:18px;box-shadow:0 5px 22px #102c2112}.hidden,[hidden]{display:none!important}button,input,select{font:inherit;border-radius:9px;padding:10px;border:1px solid #c8d7d2}button{background:#236557;color:#fff;border:0;cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}input[type=search]{flex:1;min-width:180px}.toolbar{display:flex;align-items:center;gap:9px;flex-wrap:wrap}.muted{color:#687f79}.stat{font-weight:bold}#message,#importStatus{white-space:pre-line;line-height:1.8}.table-wrap{overflow:auto}table{border-collapse:collapse;white-space:nowrap;width:100%;font-size:13px}td,th{padding:10px;border-bottom:1px solid #e2e9e6;text-align:right}th{background:#e9f3ee}tr:hover{background:#f5faf7}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin:14px 0}.card{background:#eff7f3;padding:15px;border-radius:12px}.card strong{display:block;font-size:27px;margin-top:6px}.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:14px}.chart{border:1px solid #e2ebe7;border-radius:12px;padding:14px}.bar{background:#e8efec;height:13px;border-radius:10px;overflow:hidden;flex:1}.bar>span{display:block;background:#267b68;height:100%}.barrow{display:flex;align-items:center;gap:8px;margin:10px 0;font-size:12px}.barrow .label{width:105px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.barrow b{min-width:38px;text-align:left}#pager{display:flex;justify-content:center;align-items:center;gap:10px;margin-top:14px}dialog{border:0;border-radius:18px;max-height:90vh;width:min(850px,95vw);padding:25px;box-shadow:0 20px 70px #0004}dialog::backdrop{background:#0007}.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}.fields label{display:flex;flex-direction:column;gap:5px;font-size:13px}.fields input{width:100%}.error{color:#a62f2f}.login{max-width:460px;margin:10vh auto}.login input{display:block;width:100%;margin:10px 0}@media print{header,.toolbar,#pager,.charts,.cards,#login,#importPanel,dialog,.no-print{display:none!important}.panel{box-shadow:none;padding:0}tr:not(.chosen){display:none}table{white-space:normal;font-size:10px}}
</style></head><body><header><h1>📚 نظام إدارة بيانات الدفعات التدريبية</h1><div>بحث دقيق • تحديث دون تكرار • إحصائيات تفاعلية • صلاحيات المدير</div></header><main>
<section id="login" class="panel login"><h2>🔐 تسجيل الدخول</h2><input id="email" type="email" placeholder="البريد الإلكتروني"><input id="password" type="password" placeholder="كلمة المرور"><button id="signIn">دخول</button><p id="loginError" class="error"></p></section>
<section id="app" class="hidden"><section id="importPanel" class="panel" hidden><h2>📤 استيراد وتحديث Excel — المدير فقط</h2><p class="muted">راجعي أسماء الأوراق وعدد السجلات قبل الاعتماد. الهوية الوطنية الموجودة تُحدَّث، والجديدة تُضاف.</p><input id="importFile" type="file" accept=".xlsx"><div class="toolbar" style="margin-top:10px"><button id="previewImport">معاينة الملف</button><button id="confirmImport" disabled>تأكيد الاستيراد والتحديث</button></div><p id="importStatus" role="status"></p></section>
<section class="panel"><div class="toolbar"><select id="sheet"><option value="">كل الأوراق</option></select><input id="search" type="search" placeholder="ابحثي في جميع الأعمدة"><button id="find">🔎 بحث</button><button id="logout">خروج</button></div><p id="summary" class="stat"></p></section>
<section class="panel"><div class="toolbar"><h2 style="margin-left:auto">📊 لوحة الإحصائيات</h2><label><input type="checkbox" id="selectedOnly"> إحصائيات السجلات المحددة فقط</label><button id="refreshStats">تحديث الإحصائيات</button></div><div id="statsCards" class="cards"></div><div id="statsCharts" class="charts"></div></section>
<section class="panel"><div class="toolbar"><button id="add" hidden>➕ إضافة متدرب</button><button id="selectPage">تحديد الصفحة</button><button id="selectAll">تحديد الكل</button><button id="clear">إلغاء التحديد</button><button id="deleteSelected" hidden>حذف المحدد</button><button id="deleteAll" hidden>حذف الكل</button><button id="print">🖨️ طباعة المحدد</button><button id="printAll">🖨️ طباعة الكل</button><button id="export">📥 تصدير المحدد Excel</button><button id="exportAll">📥 تصدير الكل Excel</button><span id="selectedCount" class="muted"></span></div><p id="message" role="status" class="error"></p><div class="table-wrap"><table id="records"><thead></thead><tbody></tbody></table></div><div id="pager"><button id="prev">السابق</button><span id="pageText"></span><button id="next">التالي</button></div></section></section></main>
<dialog id="editor"><h2 id="editorTitle">تعديل السجل</h2><form id="editForm"><div class="fields" id="editFields"></div><p id="editError" class="error"></p><div class="toolbar" style="margin-top:20px"><button type="submit">حفظ</button><button type="button" id="cancelEdit">إلغاء</button></div></form></dialog>
<script type="module">
import {createClient} from 'https://esm.sh/@supabase/supabase-js@2';
import {SUPABASE_URL,SUPABASE_ANON_KEY,API_BASE} from './config.js';
const sb=createClient(SUPABASE_URL,SUPABASE_ANON_KEY),$=id=>document.getElementById(id);
const COLS=['الجنس','المنطقة','المؤهل الدراسي','اسم جامعة او الكلية ( سواء كنت طالب فيها او خريج منها )','الدفعة','العام','الحالة','الاسم الثلاثي ( باللغة العربية )','الايميل','رقم الجوال','رقم الهوية الوطنية','مقرر المحاسبة','مقرر مهارات التواصل','مقرر  الزكاة','مقرر الضريبة','مقرر التكاليف','مقرر الاكسل','مقرر البرامج المحاسبية','الالتزام والانضباط','مقرر الإنجليزي',' مقرر التطبيق العملي لمحاسبة الرواتب والأجور'];
let role='',rows=[],total=0,page=1,previewed=null,editing=null;const selected=new Set(),pageSize=50;
function node(tag,value){const x=document.createElement(tag);if(value!==undefined)x.textContent=String(value??'');return x}
async function api(path,options={}){const {data:{session}}=await sb.auth.getSession();if(!session)throw Error('انتهت الجلسة؛ سجلي الدخول مجددًا');let response;try{response=await fetch(API_BASE+'/api'+path,{...options,headers:{Authorization:'Bearer '+session.access_token,...options.headers}})}catch{throw Error('تعذر الاتصال بالخادم؛ تحققي من Render والاتصال بالشبكة')}if(!response.ok){const data=await response.json().catch(()=>({}));throw Error(data.error||({401:'انتهت الجلسة',403:'ليست لديك الصلاحية',409:'تعارض أو تكرار في البيانات',413:'حجم الملف كبير',500:'خطأ في الخادم'}[response.status]||`خطأ ${response.status}`))}return response}
async function json(path,options){return (await api(path,options)).json()}
async function init(){const {data:{session}}=await sb.auth.getSession();$('login').classList.toggle('hidden',!!session);$('app').classList.toggle('hidden',!session);if(!session)return;try{role=(await json('/me')).role;$('importPanel').hidden=role!=='admin';$('add').hidden=role!=='admin';$('deleteSelected').hidden=role!=='admin';$('deleteAll').hidden=role!=='admin';await refresh()}catch(e){$('message').textContent=e.message}}
async function refresh(){const sheets=await json('/sheets'),old=$('sheet').value;$('sheet').replaceChildren(new Option('كل الأوراق',''),...sheets.map(s=>new Option(`${s.sheet_name} (${s.count})`,s.sheet_name)));$('sheet').value=old;await load()}
async function load(){try{const q=new URLSearchParams({page,sheet:$('sheet').value,search:$('search').value.trim()});const data=await json('/records?'+q);rows=data.records;total=data.total;$('summary').textContent=`عدد النتائج: ${total.toLocaleString('ar-SA')}`;const thead=$('records').querySelector('thead'),tbody=$('records').querySelector('tbody');thead.replaceChildren();tbody.replaceChildren();const tr=node('tr');for(const h of ['تحديد',...COLS,...(role==='admin'?['إجراء']:[])])tr.append(node('th',h));thead.append(tr);for(const r of rows){const line=node('tr');line.classList.toggle('chosen',selected.has(Number(r.id)));const cell=node('td'),check=document.createElement('input');check.type='checkbox';check.checked=selected.has(Number(r.id));check.onchange=()=>{check.checked?selected.add(Number(r.id)):selected.delete(Number(r.id));line.classList.toggle('chosen',check.checked);updateCount()};cell.append(check);line.append(cell);for(const col of COLS)line.append(node('td',r.payload?.[col]));if(role==='admin'){const c=node('td'),b=node('button','تعديل');b.onclick=()=>openEdit(r);c.append(b);line.append(c)}tbody.append(line)}$('pageText').textContent=`صفحة ${page} من ${Math.max(1,Math.ceil(total/pageSize))}`;$('prev').disabled=page===1;$('next').disabled=page*pageSize>=total;$('message').textContent='';updateCount();await dashboard()}catch(e){$('message').textContent=e.message}}
function updateCount(){$('selectedCount').textContent=`المحدد: ${selected.size} سجل`;if($('selectedOnly').checked)dashboard().catch(e=>$('message').textContent=e.message)}
async function dashboard(){const data=await json('/dashboard',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({sheet:$('sheet').value,search:$('search').value.trim(),selectedOnly:$('selectedOnly').checked,ids:[...selected].slice(0,80000)})});$('statsCards').replaceChildren();$('statsCharts').replaceChildren();const c=node('div');c.className='card';c.append(node('span','إجمالي السجلات'),node('strong',data.total.toLocaleString('ar-SA')));$('statsCards').append(c);for(const [field,values] of Object.entries(data.groups)){const card=node('div');card.className='card';card.append(node('span',`فئات ${field}`),node('strong',values.length.toLocaleString('ar-SA')));$('statsCards').append(card);const chart=node('div');chart.className='chart';chart.append(node('h3',field));const max=Math.max(1,...values.map(v=>v.count));for(const item of values){const row=node('div');row.className='barrow';const label=node('span',item.label);label.className='label';label.title=item.label;const bar=node('div');bar.className='bar';const fill=node('span');fill.style.width=`${item.count/max*100}%`;bar.append(fill);row.append(label,bar,node('b',item.count));chart.append(row)}$('statsCharts').append(chart)}}
function openEdit(r=null){editing=r;const fields=$('editFields');fields.replaceChildren();$('editorTitle').textContent=r?'تعديل بيانات المتدرب':'إضافة متدرب';const labels=r?COLS:['اسم الورقة',...COLS];for(const key of labels){const label=node('label',key),input=document.createElement('input');input.type='text';input.dataset.key=key;input.value=key==='اسم الورقة'?$('sheet').value||'إضافة مباشرة':r?.payload?.[key]??'';label.append(input);fields.append(label)}$('editError').textContent='';$('editor').showModal()}
$('editForm').onsubmit=async e=>{e.preventDefault();const fields={};for(const input of $('editFields').querySelectorAll('input'))fields[input.dataset.key]=input.value;const sheet=fields['اسم الورقة'];delete fields['اسم الورقة'];try{if(editing)await json('/records/'+editing.id,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({payload:fields})});else await json('/records',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({sheet_name:sheet,payload:fields})});$('editor').close();await refresh()}catch(err){$('editError').textContent=err.message}};
$('cancelEdit').onclick=()=>$('editor').close();$('add').onclick=()=>openEdit();
$('importFile').onchange=()=>{previewed=null;$('confirmImport').disabled=true;$('importStatus').textContent=''};
async function importFile(path,file){const form=new FormData();form.append('file',file);return json(path,{method:'POST',body:form})}
$('previewImport').onclick=async()=>{const file=$('importFile').files[0];if(!file)return $('importStatus').textContent='اختاري ملف Excel أولًا';$('previewImport').disabled=true;$('importStatus').textContent='جاري المعاينة...';try{const data=await importFile('/import/preview',file);previewed=file;$('confirmImport').disabled=false;$('importStatus').textContent=`إجمالي السجلات: ${data.total}\n`+data.sheets.map(s=>`${s.name}: ${s.count} سجل`).join('\n')}catch(e){$('importStatus').textContent=e.message}finally{$('previewImport').disabled=false}};
$('confirmImport').onclick=async()=>{if(!previewed||!confirm('تأكيد إضافة السجلات الجديدة وتحديث الموجودة؟'))return;$('confirmImport').disabled=true;$('importStatus').textContent='جاري الاستيراد...';try{const r=await importFile('/import/upload',previewed);$('importStatus').textContent=`تمت المعالجة: ${r.imported} | إضافة: ${r.added} | تحديث: ${r.updated} | دون تغيير: ${r.unchanged}`;previewed=null;selected.clear();page=1;await refresh()}catch(e){$('importStatus').textContent=e.message}};
$('signIn').onclick=async()=>{try{$('loginError').textContent='';const {error}=await sb.auth.signInWithPassword({email:$('email').value,password:$('password').value});if(error)throw error;await init()}catch(e){$('loginError').textContent=e.message}};
$('logout').onclick=async()=>{await sb.auth.signOut();selected.clear();await init()};$('find').onclick=()=>{page=1;selected.clear();load()};$('search').onkeydown=e=>{if(e.key==='Enter')$('find').click()};$('sheet').onchange=()=>$('find').click();$('prev').onclick=()=>{page--;load()};$('next').onclick=()=>{page++;load()};$('selectPage').onclick=()=>{rows.forEach(r=>selected.add(Number(r.id)));load()};$('selectAll').onclick=async()=>{try{const r=await json('/selection',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({sheet:$('sheet').value,search:$('search').value.trim()})});r.ids.forEach(id=>selected.add(id));await load()}catch(e){$('message').textContent=e.message}};$('clear').onclick=()=>{selected.clear();load()};$('selectedOnly').onchange=()=>dashboard().catch(e=>$('message').textContent=e.message);$('refreshStats').onclick=()=>dashboard().catch(e=>$('message').textContent=e.message);$('print').onclick=()=>{if(!rows.some(r=>selected.has(Number(r.id))))return $('message').textContent='حددي سجلات من الصفحة الحالية';window.print()};$('export').onclick=async()=>{if(!selected.size)return $('message').textContent='حددي سجلات أولًا';try{const r=await api('/export',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({ids:[...selected].slice(0,80000)})});const blob=await r.blob(),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='البيانات_المحددة.xlsx';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}catch(e){$('message').textContent=e.message}};
function scopeBody(scope){return scope==='filtered'?{scope,sheet:$('sheet').value,search:$('search').value.trim()}:{scope,ids:[...selected]};}
async function bulkExport(scope){try{const r=await api('/export-bulk',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(scopeBody(scope))});const blob=await r.blob();const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=scope==='filtered'?'جميع_النتائج.xlsx':'السجلات_المحددة.xlsx';a.click();setTimeout(()=>URL.revokeObjectURL(url),5000)}catch(e){$('message').textContent=e.message}}
async function bulkDelete(scope){if(role!=='admin')return;const body=scopeBody(scope);if(scope==='selected'&&!selected.size)return $('message').textContent='حددي سجلات أولًا';const label=scope==='filtered'?`جميع النتائج المطابقة للبحث (${total})`:`${selected.size} سجل محدد`;if(!confirm(`تحذير: هل تريدين حذف ${label} نهائيًا؟`))return;if(!confirm('تأكيد أخير: لا يمكن التراجع عن الحذف دون نسخة احتياطية.'))return;try{body.confirmAll=scope==='filtered';const r=await json('/records/delete-bulk',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});selected.clear();page=1;await refresh();$('message').textContent=`تم حذف ${r.deleted} سجل`;}catch(e){$('message').textContent=e.message}}
$('deleteSelected').onclick=()=>bulkDelete('selected');$('deleteAll').onclick=()=>bulkDelete('filtered');
$('export').onclick=()=>bulkExport('selected');$('exportAll').onclick=()=>bulkExport('filtered');
async function printScope(scope){try{let printRows=[];if(scope==='selected'&&!selected.size)throw Error('حددي سجلات أولًا');const count=scope==='filtered'?total:selected.size;if(count>2000)throw Error('الطباعة محدودة بـ 2000 سجل؛ استخدمي تصدير الكل Excel للعدد الأكبر');const all=scope==='filtered'?null:new Set(selected);for(let p=1;p<=Math.ceil(total/pageSize);p++){const q=new URLSearchParams({page:p,sheet:$('sheet').value,search:$('search').value.trim()});const data=await json('/records?'+q);printRows.push(...data.records.filter(r=>!all||all.has(r.id)));if(printRows.length>=count)break;}const w=window.open('','_blank');if(!w)throw Error('اسمحي بالنوافذ المنبثقة للطباعة');const doc=w.document;doc.documentElement.lang='ar';doc.documentElement.dir='rtl';doc.title='طباعة بيانات المتدربين';const style=doc.createElement('style');style.textContent='body{font:12px Tahoma;direction:rtl}table{border-collapse:collapse;width:100%}td,th{border:1px solid #aaa;padding:5px;text-align:right}th{background:#e6f2ee}@page{size:landscape;margin:10mm}';doc.head.append(style);const table=doc.createElement('table'),head=doc.createElement('tr');COLS.forEach(k=>head.append(node('th',k)));table.append(head);for(const r of printRows){const tr=node('tr');COLS.forEach(k=>tr.append(node('td',r.payload?.[k]??'')));table.append(tr)}doc.body.append(table);w.focus();w.print()}catch(e){$('message').textContent=e.message}}
$('print').onclick=()=>printScope('selected');$('printAll').onclick=()=>printScope('filtered');
init();
</script></body></html>
