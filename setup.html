<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إنشاء حساب المدير | برنامج المحاسبين المميزين</title><link rel="stylesheet" href="auth.css"></head><body><header><img src="https://h.top4top.io/p_3939pgxsd1.png" alt="برنامج المحاسبين المميزين"><img src="https://i.top4top.io/p_39392knk42.png" alt="شعار البرنامج" onerror="this.style.display='none'"><h1>نظام إدارة بيانات الدفعات</h1></header><main><h2>⚙️ إعداد حساب المدير لأول مرة</h2><p class="notice">هذه الصفحة لإنشاء أول مدير فقط، وليست تسجيلًا عامًا. يجب إعداد الخادم ومفتاح التهيئة السري أولًا.</p><form id="form"><label for="email">البريد الإلكتروني للمدير</label><input id="email" type="email" autocomplete="email" required><label for="password">كلمة المرور الجديدة (12 حرفًا على الأقل)</label><input id="password" type="password" minlength="12" autocomplete="new-password" required><label for="confirm">تأكيد كلمة المرور</label><input id="confirm" type="password" minlength="12" autocomplete="new-password" required><label for="key">مفتاح إعداد المدير السري من إعدادات الخادم</label><input id="key" type="password" required><button id="submit" type="submit">إنشاء حساب المدير</button></form><p id="status" role="status"></p><p><a href="login.html">العودة إلى صفحة الدخول</a></p></main><script type="module">import {API_BASE} from './config.js';const $=id=>document.getElementById(id);$('form').onsubmit=async e=>{e.preventDefault();if($('password').value!==$('confirm').value){$('status').textContent='كلمتا المرور غير متطابقتين';return}if(API_BASE.startsWith('REPLACE_')){$('status').textContent='يلزم أولًا ضبط عنوان الخادم في config.js وتشغيل الخادم الآمن.';return} $('submit').disabled=true;$('status').textContent='جارٍ إنشاء الحساب...';try{const r=await fetch(API_BASE.replace(/\/$/,'')+'/setup/first-admin',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:$('email').value,password:$('password').value,setupKey:$('key').value})});const data=await r.json().catch(()=>({}));if(!r.ok)throw Error(data.error||('تعذر إنشاء الحساب: '+r.status));$('status').textContent='تم إنشاء الحساب. يمكنك تسجيل الدخول الآن.';$('password').value='';$('confirm').value='';$('key').value=''}catch(err){$('status').textContent=err.message+' — تأكدي من تشغيل الخادم وإعداد مفاتيح المدير.'}finally{$('submit').disabled=false}};</script></body></html>
