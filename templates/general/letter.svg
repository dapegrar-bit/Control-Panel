<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1131" viewBox="0 0 1600 1131"><rect width="1600" height="1131" fill="#fff"/><rect x="58" y="58" width="1484" height="1015" rx="12" fill="none" stroke="#1F4E46" stroke-width="7"/><rect x="85" y="85" width="1430" height="70" fill="#1F4E46"/><text x="800" y="134" fill="white" text-anchor="middle" font-size="42" font-family="Tahoma,Arial" font-weight="bold">أكاديميتي</text><text x="800" y="280" fill="#1F4E46" text-anchor="middle" font-size="67" font-family="Tahoma,Arial" font-weight="bold">خطاب إفادة</text><text x="800" y="378" fill="#333" text-anchor="middle" font-size="33" font-family="Tahoma,Arial">إلى من يهمه الأمر</text><text x="800" y="465" fill="#333" text-anchor="middle" font-size="32" font-family="Tahoma,Arial">نفيدكم بأن بيانات المتدرب / المتدربة المسجل / المسجلة لدينا تخص:</text><path d="M380 670 H1220" stroke="#c1d3cc" stroke-width="2"/><text x="800" y="780" fill="#333" text-anchor="middle" font-size="31" font-family="Tahoma,Arial">وقد صدرت هذه الإفادة بناءً على البيانات المسجلة في النظام.</text><text x="800" y="833" fill="#666" text-anchor="middle" font-size="27" font-family="Tahoma,Arial">لا تُعد هذه الإفادة شهادة اجتياز أو إثباتًا لحالة تدريبية.</text><text x="1330" y="982" fill="#1F4E46" text-anchor="end" font-size="28" font-family="Tahoma,Arial">أكاديميتي</text></svg>